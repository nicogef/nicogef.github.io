<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1a2f4a"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8dcf0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#c8dcf0" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffadc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fffadc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="400" height="180" fill="url(#sky)"/>

  <!-- Moon glow -->
  <ellipse cx="310" cy="30" rx="45" ry="45" fill="url(#moon-glow)"/>
  <!-- Moon -->
  <circle cx="310" cy="30" r="18" fill="#fffde7"/>

  <!-- Stars -->
  <circle cx="50" cy="20" r="1.2" fill="#fff" opacity="0.8"/>
  <circle cx="80" cy="10" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="130" cy="25" r="1.3" fill="#fff" opacity="0.6"/>
  <circle cx="170" cy="12" r="1" fill="#fff" opacity="0.9"/>
  <circle cx="220" cy="8" r="1.2" fill="#fff" opacity="0.7"/>
  <circle cx="260" cy="20" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="350" cy="15" r="1.1" fill="#fff" opacity="0.8"/>
  <circle cx="380" cy="40" r="1" fill="#fff" opacity="0.5"/>

  <!-- Castle silhouette (right) -->
  <g fill="#0a1520">
    <!-- Main tower -->
    <rect x="290" y="60" width="80" height="80"/>
    <!-- Crenellations -->
    <rect x="290" y="52" width="14" height="12"/>
    <rect x="308" y="52" width="14" height="12"/>
    <rect x="326" y="52" width="14" height="12"/>
    <rect x="344" y="52" width="14" height="12"/>
    <rect x="362" y="52" width="14" height="12"/>
    <!-- Gate arch -->
    <rect x="320" y="105" width="30" height="35"/>
    <ellipse cx="335" cy="105" rx="15" ry="10" fill="#0a1520"/>
    <!-- Window -->
    <rect x="327" y="72" width="16" height="20" fill="#1a3a5c" rx="2"/>
    <!-- Side wing -->
    <rect x="260" y="80" width="35" height="60"/>
    <rect x="260" y="72" width="10" height="10"/>
    <rect x="274" y="72" width="10" height="10"/>
    <rect x="285" y="72" width="10" height="10"/>
  </g>

  <!-- Forest silhouette (left) -->
  <g fill="#071018">
    <ellipse cx="20" cy="110" rx="22" ry="55"/>
    <ellipse cx="50" cy="95" rx="20" ry="65"/>
    <ellipse cx="78" cy="105" rx="22" ry="55"/>
    <ellipse cx="105" cy="90" rx="18" ry="70"/>
    <ellipse cx="130" cy="100" rx="20" ry="60"/>
    <ellipse cx="155" cy="108" rx="18" ry="52"/>
    <!-- Tree trunks -->
    <rect x="44" y="140" width="6" height="40"/>
    <rect x="72" y="145" width="6" height="35"/>
    <rect x="100" y="138" width="6" height="42"/>
    <rect x="126" y="143" width="5" height="37"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="138" width="400" height="42" fill="#0a1520"/>

  <!-- Path -->
  <path d="M 180 180 Q 200 155 195 138" stroke="#162840" stroke-width="14" fill="none"/>
  <path d="M 180 180 Q 200 155 195 138" stroke="#1e3a55" stroke-width="8" fill="none"/>

  <!-- Knight silhouette -->
  <g fill="#060e18" transform="translate(185,95)">
    <!-- Body -->
    <rect x="-8" y="20" width="16" height="24" rx="2"/>
    <!-- Head/Helmet -->
    <ellipse cx="0" cy="14" rx="9" ry="10"/>
    <rect x="-9" y="6" width="18" height="8" rx="1"/>
    <!-- Visor slit -->
    <rect x="-7" y="10" width="14" height="3" fill="#1a3a5c" rx="1"/>
    <!-- Legs -->
    <rect x="-8" y="44" width="7" height="16" rx="1"/>
    <rect x="1" y="44" width="7" height="16" rx="1"/>
    <!-- Sword -->
    <rect x="10" y="18" width="3" height="28" rx="1"/>
    <rect x="6" y="22" width="11" height="3" rx="1"/>
    <!-- Cape -->
    <path d="M -8 22 Q -18 35 -14 60 L -8 44 Z" fill="#0f2035"/>
  </g>

  <!-- Fog layer -->
  <rect x="0" y="110" width="400" height="70" fill="url(#fog)"/>
  <ellipse cx="100" cy="145" rx="120" ry="30" fill="#bed7eb" fill-opacity="0.3"/>
  <ellipse cx="300" cy="150" rx="100" ry="25" fill="#bed7eb" fill-opacity="0.25"/>
</svg>
