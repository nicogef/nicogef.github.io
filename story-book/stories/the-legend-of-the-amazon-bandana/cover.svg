    <line x1="46" y1="218" x2="46" y2="243" stroke="#6b4a1a" stroke-width="2.5"/>
    <rect x="41" y="242" width="10" height="4" fill="#8a6a2a" rx="1"/>
  </g>

  <!-- "OR ELSE!" right -->
  <g transform="rotate(6,361,155)">
    <rect x="337" y="143" width="50" height="22" rx="3" fill="#88dd00" stroke="#55aa00" stroke-width="1.2"/>
    <text x="362" y="158" font-family="'Arial Black',sans-serif" font-size="8" fill="#1a3300" text-anchor="middle" font-weight="900">OR ELSE!</text>
    <line x1="362" y1="165" x2="362" y2="190" stroke="#6b4a1a" stroke-width="2.5"/>
    <rect x="357" y="189" width="10" height="4" fill="#8a6a2a" rx="1"/>
  </g>

