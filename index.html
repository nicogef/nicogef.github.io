<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Funny Games</title>
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/tiles.css">
</head>
<body>
  <div class="background"></div>
  <div class="blur-container"></div>
  <div class="tiles-container">
    <a href="./learn-notes/learn-notes.html" class="tile">
      <img src="../resources/note-finder-img.png" alt="note-finder-img" />
      <div class="tile-content">             
        <h2 class="tile-title">Note Finder</h2>
        <p class="tile-score" id="learn-notes"></p>
      </div>
    </a>
    <a href="./trivia/trivia.html" class="tile">
      <img src="../resources/trivia-img.jpg" alt="trivia-img" />
      <div class="tile-content">             
        <h2 class="tile-title">Trivia Trainer</h2>
        <p class="tile-score" id="trivia"></p>
      </div>
    </a>
    <a href="./simple-math/simple-math.html" class="tile">
      <img src="../resources/math-img.jpg" alt="math-img" />
      <div class="tile-content">             
        <h2 class="tile-title">Simple Math</h2>
        <p class="tile-score" id="simple-math"></p>
      </div>
    </a>
    <a href="./activities/activities.html" class="tile">
      <img src="../resources/activities-img.jpg" alt="activities-img" style="object-position: top;"/>
      <div class="tile-content">             
        <h2 class="tile-title">Activites</h2>
        <p class="tile-score" id="activites"></p>
      </div>
    </a>
  </div>
  <script type="module" src="./js/index.js"></script>
</body>
</html>
