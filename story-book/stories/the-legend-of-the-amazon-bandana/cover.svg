    <rect x="334" y="368" width="52" height="22" rx="3" fill="#ffdd00" stroke="#ccaa00" stroke-width="1.2"/>
    <text x="360" y="383" font-family="'Arial Black',sans-serif" font-size="9" fill="#332200" text-anchor="middle" font-weight="900">CHOOSE</text>
    <line x1="360" y1="390" x2="360" y2="415" stroke="#6b4a1a" stroke-width="2.5"/>
    <rect x="355" y="414" width="10" height="4" fill="#8a6a2a" rx="1"/>
  </g>

  <!-- "YOUR DAD" bottom right -->
  <g transform="rotate(-4,360,412)">
    <rect x="334" y="400" width="52" height="22" rx="3" fill="#ff66cc" stroke="#cc3399" stroke-width="1.2"/>
    <text x="360" y="415" font-family="'Arial Black',sans-serif" font-size="8" fill="white" text-anchor="middle" font-weight="900">YOUR DAD</text>
    <line x1="360" y1="422" x2="360" y2="447" stroke="#6b4a1a" stroke-width="2.5"/>
    <rect x="355" y="446" width="10" height="4" fill="#8a6a2a" rx="1"/>
  </g>

  <!-- "OR ELSE!" bottom left -->
  <g transform="rotate(7,46,404)">
    <rect x="20" y="392" width="52" height="22" rx="3" fill="#aa44ff" stroke="#7722cc" stroke-width="1.2"/>
    <text x="46" y="407" font-family="'Arial Black',sans-serif" font-size="8" fill="white" text-anchor="middle" font-weight="900">OR ELSE!</text>
    <line x1="46" y1="414" x2="46" y2="439" stroke="#6b4a1a" stroke-width="2.5"/>
    <rect x="41" y="438" width="10" height="4" fill="#8a6a2a" rx="1"/>
  </g>

  <!-- ══ GLOBE ══ -->
  <circle cx="208" cy="261" r="90" fill="rgba(0,0,0,0.12)"/>
  <rect x="0" y="0" width="400" height="520" fill="url(#dp)" clip-path="url(#gc)"/>
  <g clip-path="url(#gc)" stroke="#222" stroke-width="1" opacity="0.45">
    <line x1="117" y1="170" x2="293" y2="346"/>
    <line x1="147" y1="170" x2="293" y2="316"/>
    <line x1="177" y1="170" x2="293" y2="286"/>
    <line x1="207" y1="170" x2="293" y2="256"/>
    <line x1="237" y1="170" x2="293" y2="226"/>
    <line x1="117" y1="200" x2="278" y2="361"/>
    <line x1="117" y1="230" x2="263" y2="376"/>
    <line x1="117" y1="260" x2="240" y2="383"/>
    <line x1="117" y1="290" x2="212" y2="385"/>
    <line x1="293" y1="170" x2="117" y2="346"/>
    <line x1="263" y1="170" x2="117" y2="316"/>
    <line x1="233" y1="170" x2="117" y2="286"/>
    <line x1="203" y1="170" x2="117" y2="256"/>
    <line x1="173" y1="170" x2="117" y2="226"/>
    <line x1="293" y1="200" x2="128" y2="365"/>
    <line x1="293" y1="230" x2="143" y2="380"/>
    <line x1="293" y1="260" x2="166" y2="387"/>
    <line x1="293" y1="290" x2="196" y2="387"/>
  </g>
  <circle cx="205" cy="258" r="88" fill="none" stroke="#222" stroke-width="3"/>

  <!-- ══ CYCLOPS HEAD ══ -->
  <ellipse cx="205" cy="252" rx="36" ry="42" fill="#d4c8a8" stroke="#555" stroke-width="2"/>
  <path d="M172,236 Q180,218 192,228 Q198,214 205,222 Q212,212 218,226 Q228,216 238,236" fill="#8a6a3a" stroke="#6a4a1a" stroke-width="1.5"/>
  <ellipse cx="170" cy="252" rx="8" ry="11" fill="#c8b898" stroke="#555" stroke-width="1.5"/>
  <ellipse cx="240" cy="252" rx="8" ry="11" fill="#c8b898" stroke="#555" stroke-width="1.5"/>
  <ellipse cx="205" cy="245" rx="20" ry="14" fill="white" stroke="#222" stroke-width="1.8"/>
  <path d="M183,232 Q205,224 227,232" fill="none" stroke="#4a3010" stroke-width="4" stroke-linecap="round"/>
  <circle cx="205" cy="247" r="9" fill="#2ab0c0"/>
  <circle cx="205" cy="247" r="4.5" fill="#080818"/>
  <circle cx="210" cy="243" r="2.5" fill="white" opacity="0.9"/>
  <path d="M200,264 Q205,275 210,264" fill="none" stroke="#6a4a2a" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="200" cy="270" r="3" fill="#c0a080" stroke="#6a4a2a" stroke-width="1"/>
  <circle cx="210" cy="270" r="3" fill="#c0a080" stroke="#6a4a2a" stroke-width="1"/>
  <path d="M185,282 Q195,292 205,293 Q215,292 225,282" fill="none" stroke="#4a2a10" stroke-width="2" stroke-linecap="round"/>

  <!-- ══ BOTTOM TEXT BOX ══ -->
  <rect x="86" y="376" width="228" height="76" rx="3" fill="rgba(255,255,255,0.85)" stroke="#556633" stroke-width="1.8" transform="rotate(-0.8,200,414)"/>
  <text x="98" y="395" font-family="'Comic Sans MS',cursive" font-size="12" fill="#111" font-weight="bold">Choose the right</text>
  <text x="98" y="411" font-family="'Comic Sans MS',cursive" font-size="11" fill="#111">path  find your dad</text>
  <text x="98" y="426" font-family="'Comic Sans MS',cursive" font-size="11" fill="#111">otherwise your journey</text>
  <text x="98" y="444" font-family="'Comic Sans MS',cursive" font-size="11" fill="#cc1111" font-weight="bold">ENDS!</text>

  <!-- ══ DO NOT READ ══ -->
  <g transform="rotate(-90,52,462)">
    <text x="52" y="462" font-family="'Comic Sans MS',cursive" font-size="11" fill="#555">do not read</text>
  </g>

  <!-- ══ ENDS TRAGICALLY rectangle ══ -->
  <g transform="rotate(-1.5,200,492)">
    <rect x="88" y="464" width="224" height="48" rx="4" fill="#0a0a2a" stroke="#cc1111" stroke-width="2.5"/>
    <rect x="92" y="468" width="216" height="40" rx="2" fill="none" stroke="#cc1111" stroke-width="0.8" opacity="0.5"/>
    <text x="200" y="486" font-family="'Arial Black',sans-serif" font-size="14" fill="#ff2222" text-anchor="middle" font-weight="900" letter-spacing="2">ENDS</text>
    <text x="200" y="504" font-family="'Arial Black',sans-serif" font-size="11" fill="#ff6622" text-anchor="middle" font-weight="900" letter-spacing="1">TRAGICALLY!!!!</text>
