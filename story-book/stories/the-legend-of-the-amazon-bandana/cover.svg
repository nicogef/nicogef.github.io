<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520">
  <defs>
    <pattern id="dp" x="190" y="250" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#e8902a"/>
      <polygon points="15,0 30,15 15,30 0,15" fill="#28b4c2"/>
    </pattern>
    <clipPath id="gc">
      <circle cx="205" cy="258" r="88"/>
    </clipPath>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefef8"/>
      <stop offset="100%" stop-color="#f4f4ec"/>
    </linearGradient>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0e5b8"/>
      <stop offset="50%" stop-color="#e8d898"/>
      <stop offset="100%" stop-color="#d4c070"/>
    </linearGradient>
  </defs>

  <!-- Paper -->
  <rect width="400" height="520" fill="url(#paper)"/>

  <!-- ══ STORY TITLE — above the map, no rectangle ══ -->
  <text x="200" y="24" font-family="'Comic Sans MS',cursive" font-size="15" fill="#111"
        text-anchor="middle" font-weight="bold" transform="rotate(-1,200,24)">The Search in the Amazon</text>
  <text x="200" y="44" font-family="'Comic Sans MS',cursive" font-size="13" fill="#cc1111"
        text-anchor="middle" transform="rotate(1,200,44)">You are Doomed!</text>
  <text x="200" y="60" font-family="'Comic Sans MS',cursive" font-size="10" fill="#555"
        text-anchor="middle" font-style="italic">the legend of the Amazon bandana</text>

  <!-- ══ ORANGE VERTICAL TEXT (fully visible, outside map edges) ══ -->
  <g font-family="'Arial Black', sans-serif" font-size="46" fill="#e05c00" font-weight="900" font-style="italic">
    <text x="8"  y="188" transform="rotate(-3,8,188)">d</text>
    <text x="6"  y="236" transform="rotate(2,6,236)">a</text>
    <text x="9"  y="283" transform="rotate(-2,9,283)">n</text>
    <text x="5"  y="330" transform="rotate(3,5,330)">g</text>
    <text x="8"  y="377" transform="rotate(-1,8,377)">e</text>
    <text x="7"  y="422" transform="rotate(2,7,422)">r</text>
  </g>
  <g font-family="'Arial Black', sans-serif" font-size="40" fill="#e05c00" font-weight="900" font-style="italic">
    <text x="362" y="175" transform="rotate(3,362,175)">i</text>
    <text x="356" y="218" transform="rotate(-2,356,218)">n</text>
    <text x="348" y="263" transform="rotate(2,348,263)">s</text>
    <text x="353" y="305" transform="rotate(-3,353,305)">i</text>
    <text x="347" y="348" transform="rotate(2,347,348)">g</text>
    <text x="347" y="390" transform="rotate(-1,347,390)">h</text>
    <text x="350" y="432" transform="rotate(2,350,432)">t</text>
  </g>

  <!-- ══ MAP RECTANGLE (the rectangle IS the map) ══ -->
