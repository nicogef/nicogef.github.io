title: The Legend of the Amazon bandana
description: >-
  The Search in the amazon, Choose the right path, find your dad, otherwise your
  journey ENDS
start: p-7kasuru2hru
pages:
  - id: p-7kasuru2hru
    title: Introduction
    text: >-
      You find an old book in your missing Dad's office.

      It tells you about an ancient artefact that he was reasearching about
      choose the right path Find your Dad wrong path your Story ends tragically!


      **Beware and warning!!!**


      This book is different from others, in this book you are in charge of
      everything that happens the wrong move not a problem you can go back and
      take another path!
    image: >-
      data:image/svg+xml;base64,
    next: p-9h816hqjq2w
  - id: p-9h816hqjq2w
    title: And it begins
    text: >+
      You sit up in you bed.


      Warm Sunlight brushes across you Skin.

      As you flick the light switch. Electricity Crackles the air is cool as
      your eye adjust to the light you notice a note on the bedroom door. You
      walk towards it.


      ~~you~~ It writes and you heave a sigh gone to work early again.

      You put the note in the bin then open the door and step into the dark
      Hallway.


      Darkness envelops you, the air turns thick and cold as you walk down the
      Hallway floorboards creak under your feet you pass the attic.


      Your Mum said you could not go inside. Then you pass your Mum and Dad's
      bedroom, veer right into the kitchen, grab the eggs from the fridge and
      start Munching on them.


      **"thud"**


      Suddenly you hear a sound coming from the attic and everything goes quiet
      again...

    image: >-
      data:image/svg+xml;base64,
    choices:
      - text: Explore the Attic
        next: p-y0lq6x9zsck
      - text: Ignore the Noise
        next: p-ymnd2x8056k
  - id: p-y0lq6x9zsck
    title: Explore the Attic
    text: >-
      Youstop eating and walk to the Attic.

      As you walk up the stairs floorboards creak under your feet. When you
      reach the top, you creak the door open and enter the room.


      Books lining on the shelves, in the middle of the room is a Desk pitted
      with books and scattered papers, you notice one of the book is lying on
      the ground.


      You pick it up and start flipping through, word line the pages, as you
      flip through, you notice a note wedged in.


      Looking back at the front cover you see the title say "__**The legend of
      the Amazon Bandana**__"


      You take the note, it is a map of the Amazon River, you notice a **X**
      carefully marked in the corner, 


      **it is a treasure Map !!!**, 


      The **X** is labelled in your dad's handwriting and it says "Amazon
      Bandana". At the back of the Map, it says "Stop the evil Cyclops""


      You start piecing everything together, your dad was looking for the
      artefact trying to stop the evil cyclops.
    choices:
      - text: You call the police
        next: p-5m33rplicjo
      - text: You decide to go yourself
        next: p-hux41dwj41p
  - id: p-ymnd2x8056k
    title: Ignore the noise
    text: >-
      You ignore the Sound from the Attic and finish your eggs, go back to your
      bedroom and start reading your favorite book.


      The Story is about an explorer who explores the Amazon. As deeply focused
      reading the story filled with exiting adventures. the phone rings suddenly
      sending a jolt up your spine.
    choices:
      - text: Answer the phone
        next: p-hrx6czrsglp
      - text: Ignore the Phone
        next: p-txmaeyxt33w
  - id: p-5m33rplicjo
    title: Call the police
    text: |-
      After your call the police comes to your house.

      As soon as you tell them what you found, they tell you:
      "We will take it from here."

      They call your mum, and tell her what happened.
  - id: p-hux41dwj41p
    title: Go find You Dad on your Own
    text: >-
      Your Grab your things:

      - A magnifying Glass

      - A bottle

      - A lunchbox

      - A few old books

      You forget the note.


      You leave a note at the Door so that if you do not not make it back, at
      least your mum will know what happened.


      Now, you need to choose how you are going to go there.
    choices:
      - text: You take your bike
        next: p-6tokv76euw4
      - text: You take the Bus
        next: p-h2ucbtjf4ik
  - id: p-hrx6czrsglp
    title: Answer the phone
    text: >-
      Surprisingly it is your friend asking if you woul dlike to come to his
      house. Of course you say yes.


      You go there by bike; it is only a few blocks away. You play video games
      for five hours when it is time to go home. You get home and there is a
      knock on the door, you answer to see your mum and you dad.


      "They found him says you mum."
  - id: p-txmaeyxt33w
    title: Ignore the Phone
    text: >-
      It stops ringing, put your book back in the bookshelves.


      You are hungry, it is morning tea after all, you go to the kitchen and get
      a cracker from the pantry.


      Suddenly there is knock on the door.
    choices:
      - text: You answer the door
        next: p-8900ifewwws
      - text: You Ignore the knock
        next: p-oxsuz56xb7g
  - id: p-8900ifewwws
    title: Answer the Door
    text: >-
      A man steps in, followed by two other men. 

      He snaps his fingers; the two other men grab you and throw you in a black
      Van, they drive away.


      **You should not have open the door!!!**
  - id: p-oxsuz56xb7g
    title: Ignore the Door
    text: |-
      A man breaks in.

      You scream as he corners you in the kitchen.

      You wail in pain as he steps on you Rib cage.
  - id: p-6tokv76euw4
    title: You take your bike
    text: >-
      It is the mountain Bike you got for your birthday.


      It is going to be a long ride, so you take a second water bottle. As you
      bike you pass a lot of houses. At some point you enter farmland, there are
      cows and horses, goat and even Alpacas.


      You come to the edge of the Amazon, you keep biking until you come to a
      crossroad. A path where you can keep biking. A Narrow Bushy path, you will
      have to leave you bike.
    choices:
      - text: The bike Path
        next: p-10ams3pyj7v
      - text: The narrow Bushy Path
        next: p-1bkpd6wzclo
  - id: p-h2ucbtjf4ik
    title: You take the Bus
    text: >-
      You leave taking Bus 72, you need to be careful. The next stop is your
      mum's workplace.


      When you enter you find the whole bus full but a single seat at the back.
      You walk and seat there, the Bus starts moving.


      You get to the first Stop hoping your mum did not see you leaving through
      the security system at your house.


      She did see you...


      **You are in so much trouble!!!**
  - id: p-10ams3pyj7v
    title: The bike Path
    text: >-
      You keep riding you Bike, until you reach the police.


      They are investigating about your dad, they ask you what you are doing
      there.


      While you are telling your story, they smile at you creepily and say:
      "Sorry we will have to stop you before you tell anyone."


      They grab you by the wrist and throw you in their car.
  - id: p-1bkpd6wzclo
    title: The narrow Bushy Path
    text: >-
      You Leave your bike at the beginning of the trail, on the side of the
      road.


      You walk through vines thrashing at them when they are in your way. You
      past animals and finally get to a temple. A brick slides and a Sphinx
      comes out. He asks you a question.
    choices:
      - text: You Choose Answer 1
        next: p-3gza3radjec
      - text: You choose Answer 2
        next: p-b3txldtdl1v
  - id: p-3gza3radjec
    title: Answer 1
    text: >
      The Door opnes and you step in a room.


      You look around and see only crates and a prison cell. In that prison cell
      sits... **your dad!!!**

       You run towards him,, your footsteps echoing.

      "Hello Buddy" he says.

      "Hi" you respond.

      "Do I free you?" you ask.

      "No tell the police, they will handle it, quick" he answers.


      Then suddenly you hear Voice coming from the Hallway.
    choices:
      - text: Tell the police
        next: p-4flo2yrvsyk
      - text: Hide and wait
        next: p-fvjwqo0wdvo
  - id: p-b3txldtdl1v
    title: Answer 2
    text: >-
      The sphinx tells you that you are incorrect and goes back in the temple
      brick.


      The door does not budge...

      You decide to search around the building for any entries.

      You see only bricks until you find an open window. You try to reach it,
      but it is too high.

      You hear a noise coming from the bushes and turn around, no-one is there.

      You go back to the front of the temple.
    choices:
      - text: Go back to the bike path
        next: p-10ams3pyj7v
      - text: Take another look
        next: p-qocf7ymmkdv
  - id: p-4flo2yrvsyk
    title: Tell the police
    text: >-
      You walk back out the door, your heart thumping.


      Adrenalin rushes through you.


      You get to your back and ride as fast as you can to the nearest police
      station.


      When you get there, you tell them. They send 4 vehicles and tell you they
      will handle it. 
  - id: p-fvjwqo0wdvo
    title: Hide and wait
    text: >-
      You hide behind a crate instead as the voice get closer your heart thumps
      out. Come two men one skinny and one muscular with... one Eye in the
      middle...


      He says "Tomorrow night, I shall become an immortal cyclops and over the
      world. MwaHaHaHa!!!!"


      You realize he has a bandana on his head.

      You remember that whoever wears the bandana n the full moon will become
      invincible, if you take the bandana off he will be human again.


      You jump out of behind the crate snatch the bandana, free you dad and run
      away. 


      After lots of running away from the two men, you tell the police and they
      arrest the two men.
  - id: p-qocf7ymmkdv
    title: Take another look
    text: >-
      You look back to the window and notice a small hook in the ground that you
      missed before.


      You pull the hook and a staircase open in front of you.

      You go down, your footsteps echo in the darkness.


      You enter a room at the same time as a man. To your surprise he has a
      single eye in the middle of his head. He quickly runs towards you and
      grabs you by the neck.
cover: >-
  data:image/svg+xml;base64,
