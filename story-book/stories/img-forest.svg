<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180">
  <defs>
    <radialGradient id="moonlight" cx="70%" cy="15%" r="40%">
      <stop offset="0%" stop-color="#e8f4e8"/>
      <stop offset="40%" stop-color="#1a3a1a"/>
      <stop offset="100%" stop-color="#060e06"/>
    </radialGradient>
    <radialGradient id="moon-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e6ffe6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e6ffe6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="path-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a4a2a"/>
      <stop offset="100%" stop-color="#1a3018"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="180" fill="url(#moonlight)"/>

  <!-- Moon halo -->
  <ellipse cx="280" cy="28" rx="50" ry="50" fill="url(#moon-halo)"/>
  <!-- Moon -->
  <circle cx="280" cy="28" r="20" fill="#e8ffe0"/>
  <!-- Moon crater details -->
  <circle cx="274" cy="24" r="4" fill="#000" fill-opacity="0.05"/>
  <circle cx="284" cy="32" r="3" fill="#000" fill-opacity="0.04"/>

  <!-- Stars -->
  <circle cx="30" cy="15" r="1.2" fill="#cfffcf" opacity="0.7"/>
  <circle cx="70" cy="8" r="1" fill="#cfffcf" opacity="0.6"/>
  <circle cx="110" cy="20" r="1.3" fill="#cfffcf" opacity="0.8"/>
  <circle cx="150" cy="5" r="1" fill="#cfffcf" opacity="0.5"/>
  <circle cx="190" cy="18" r="1.2" fill="#cfffcf" opacity="0.7"/>
  <circle cx="350" cy="10" r="1" fill="#cfffcf" opacity="0.6"/>
  <circle cx="380" cy="22" r="1.2" fill="#cfffcf" opacity="0.5"/>

  <!-- Ground -->
  <rect x="0" y="140" width="400" height="40" fill="#0a1a0a"/>

  <!-- Path through forest -->
  <path d="M 175 180 Q 190 160 185 140 Q 192 115 200 90" stroke="none" fill="#162816"/>
  <path d="M 225 180 Q 210 160 215 140 Q 208 115 200 90" stroke="none" fill="#162816"/>
  <path d="M 175 180 Q 190 160 185 140 Q 192 115 200 90 Q 208 115 215 140 Q 210 160 225 180 Z"
        fill="#1e3a1a"/>
  <!-- Path moonlight highlight -->
  <path d="M 185 180 Q 196 158 193 140 Q 199 118 202 95 Q 205 118 207 140 Q 204 158 215 180 Z"
        fill="#243e20" opacity="0.5"/>

  <!-- Left trees (dark, twisted) -->
  <!-- Tree 1 - far left -->
  <path d="M 15 180 Q 20 120 10 80 Q 5 50 18 20 Q 30 50 22 80 Q 28 120 25 180 Z" fill="#071007"/>
  <path d="M 18 20 Q 0 30 -10 50 Q 5 45 18 30 Z" fill="#071007"/>
  <path d="M 18 20 Q 35 5 50 15 Q 35 20 18 30 Z" fill="#071007"/>
  <path d="M 20 50 Q 2 55 -5 70 Q 8 62 20 58 Z" fill="#071007"/>
  <path d="M 22 50 Q 40 45 48 60 Q 35 55 22 58 Z" fill="#071007"/>
  <!-- Twisted branch tips -->
  <ellipse cx="-5" cy="52" rx="18" ry="28" fill="#071007"/>
  <ellipse cx="50" cy="18" rx="22" ry="30" fill="#071007"/>

  <!-- Tree 2 -->
  <path d="M 55 180 Q 58 125 48 85 Q 44 55 58 25 Q 70 55 64 85 Q 60 125 65 180 Z" fill="#061006"/>
  <ellipse cx="32" cy="60" rx="28" ry="38" fill="#071007"/>
  <ellipse cx="80" cy="40" rx="25" ry="40" fill="#071007"/>
  <ellipse cx="58" cy="25" rx="20" ry="32" fill="#071007"/>

  <!-- Tree 3 -->
  <path d="M 100 180 Q 102 130 92 95 Q 88 65 102 35 Q 116 65 108 95 Q 104 130 108 180 Z" fill="#071007"/>
  <ellipse cx="72" cy="75" rx="26" ry="42" fill="#071007"/>
  <ellipse cx="128" cy="55" rx="24" ry="44" fill="#071007"/>
  <ellipse cx="102" cy="35" rx="22" ry="35" fill="#071007"/>

  <!-- Tree 4 (close left, partially in frame) -->
  <path d="M 142 180 Q 145 128 136 92 Q 130 60 145 30 Q 160 60 152 92 Q 148 128 155 180 Z" fill="#060e06"/>
  <ellipse cx="118" cy="68" rx="28" ry="45" fill="#071007"/>
  <ellipse cx="168" cy="48" rx="22" ry="42" fill="#071007"/>

  <!-- Right trees -->
  <!-- Tree 5 -->
  <path d="M 258 180 Q 255 128 265 92 Q 270 60 255 30 Q 240 60 248 92 Q 252 128 245 180 Z" fill="#060e06"/>
  <ellipse cx="232" cy="68" rx="22" ry="42" fill="#071007"/>
  <ellipse cx="282" cy="48" rx="28" ry="45" fill="#071007"/>

  <!-- Tree 6 -->
  <path d="M 300 180 Q 298 130 308 95 Q 312 65 298 35 Q 284 65 292 95 Q 296 130 290 180 Z" fill="#071007"/>
  <ellipse cx="272" cy="75" rx="24" ry="44" fill="#071007"/>
  <ellipse cx="328" cy="55" rx="26" ry="42" fill="#071007"/>
  <ellipse cx="298" cy="35" rx="22" ry="35" fill="#071007"/>

  <!-- Tree 7 - far right -->
  <path d="M 348 180 Q 345 125 355 88 Q 360 55 345 22 Q 332 55 338 88 Q 342 125 340 180 Z" fill="#071007"/>
  <ellipse cx="320" cy="62" rx="25" ry="40" fill="#071007"/>
  <ellipse cx="372" cy="42" rx="28" ry="38" fill="#071007"/>
  <ellipse cx="395" cy="55" rx="20" ry="35" fill="#071007"/>

  <!-- Moss/glowing details on path edges -->
  <circle cx="178" cy="148" r="3" fill="#3a7a30" opacity="0.7"/>
  <circle cx="172" cy="158" r="2.5" fill="#4a8a40" opacity="0.6"/>
  <circle cx="222" cy="152" r="3" fill="#3a7a30" opacity="0.7"/>
  <circle cx="228" cy="162" r="2.5" fill="#4a8a40" opacity="0.6"/>
  <circle cx="190" cy="168" r="2" fill="#5a9a50" opacity="0.5"/>
  <circle cx="210" cy="165" r="2" fill="#5a9a50" opacity="0.5"/>

  <!-- Fox silhouette on path -->
  <g fill="#8a5a20" transform="translate(196,148)">
    <ellipse cx="0" cy="0" rx="9" ry="5"/>
    <ellipse cx="-7" cy="-1" rx="5" ry="4"/>
    <!-- Ears -->
    <path d="M -10 -4 L -14 -10 L -7 -6 Z" fill="#8a5a20"/>
    <path d="M -5 -5 L -8 -11 L -3 -6 Z" fill="#8a5a20"/>
    <!-- Tail -->
    <path d="M 9 0 Q 18 -6 16 -12 Q 12 -8 9 0 Z" fill="#7a4a18"/>
    <!-- Legs -->
    <rect x="-6" y="4" width="3" height="5" rx="1"/>
    <rect x="-1" y="4" width="3" height="5" rx="1"/>
    <rect x="3" y="4" width="3" height="5" rx="1"/>
  </g>

  <!-- Light rays through canopy -->
  <path d="M 280 0 L 220 90 L 230 90 L 295 0 Z" fill="#b4ffb4" fill-opacity="0.04"/>
  <path d="M 260 0 L 195 100 L 205 100 L 270 0 Z" fill="#b4ffb4" fill-opacity="0.03"/>
</svg>
