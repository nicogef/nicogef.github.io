<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Solfege Note Finder Game (Adjustable Speed)</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="./learn-notes.css">
</head>
<body>
  <div class="container">
    <h1>Solfege Note Finder Game</h1>
    <div id="speedDiv">
        <label><input name="notation" type="radio" id="solfege" checked>Solfege</label>
        <label><input name="notation" type="radio" id="alphabet">Alphabet</label>
    </div>
    <div class="header-row">
        <table class="configuration-table">
            <thead><tr><th>Clef</th><th>Octave</th> </tr></thead>
            <tbody><tr width="50" height="50"><td id="clefs"></td> <td><ul id="octaves"></ul></td></tr></tbody>
        </table>
        <div class="status-bar">
            <p class="score"><span id="score"></span></p>
            <p class="score"><span id="best-score"></span></p>
            <button id="start" class="start-btn">Start Game</button>
        </div>
    </div>
    <div class="game-container">
        <div class="game-card">
        <div id="feedback"></div>
        <canvas id="noteDisplay" width="400" height="200"></canvas>
        <div class="piano">
            <div class="white-keys">
                <div class="white-key" data-note="C">C</div>
                <div class="white-key" data-note="D">D</div>
                <div class="white-key" data-note="E">E</div>
                <div class="white-key" data-note="F">F</div>
                <div class="white-key" data-note="G">G</div>
                <div class="white-key" data-note="A">A</div>
                <div class="white-key" data-note="B">B</div>
            </div>
            <div class="black-keys">
                <div class="black-key" data-note="C#"></div>
                <div class="black-key" data-note="D#"></div>
                <div class="black-key" data-note="F#"></div>
                <div class="black-key" data-note="G#"></div>
                <div class="black-key" data-note="A#"></div>
            </div>
        </div>
    </div>
    </div>
    <div id="speedDiv">
        <label id="speedLabel" for="speedRange">Speed:</label>
        <input id="speedRange" type="range" min="1" max="100" value="50" />
        <span id="speedValue">50</span>
    </div>
  </div>
  <script type="module" src="./learn-notes.js"></script>
</body>
</html>
