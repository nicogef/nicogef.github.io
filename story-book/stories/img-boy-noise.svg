<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180">
  <defs>
    <linearGradient id="night-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="floor-night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c2c3e"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd580" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffd580" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark room background -->
  <rect width="400" height="180" fill="url(#night-bg)"/>

  <!-- Floor -->
  <rect x="0" y="135" width="400" height="45" fill="url(#floor-night)"/>
  <line x1="0" y1="135" x2="400" y2="135" stroke="#2a2a3e" stroke-width="1.5"/>

  <!-- Window with moonlight -->
  <rect x="20" y="20" width="70" height="90" rx="3" fill="#0d1b3e"/>
  <rect x="20" y="20" width="70" height="90" rx="3" fill="none" stroke="#555" stroke-width="3"/>
  <!-- Moonlight beam -->
  <polygon points="25,25 85,25 100,135 10,135" fill="#c8d8f0" opacity="0.06"/>
  <!-- Moon -->
  <circle cx="62" cy="52" r="14" fill="#e8e8c8"/>
  <circle cx="68" cy="47" r="11" fill="#0d1b3e"/>
  <!-- Stars -->
  <circle cx="38" cy="35" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="75" cy="30" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="28" cy="55" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="80" cy="60" r="1.5" fill="#fff" opacity="0.5"/>

  <!-- Bedside lamp (small glow) -->
  <rect x="310" y="85" width="30" height="50" rx="2" fill="#2a2a3a"/>
  <rect x="315" y="80" width="20" height="8" rx="2" fill="#3a3a4a"/>
  <!-- Lampshade -->
  <polygon points="308,68 332,68 326,82 314,82" fill="#9b7b3c"/>
  <!-- Light glow -->
  <ellipse cx="320" cy="75" rx="40" ry="35" fill="url(#lamp-glow)"/>
  <circle cx="320" cy="75" r="5" fill="#ffd580" opacity="0.6"/>

  <!-- ===== BOY CHARACTER ===== -->
  <!-- Shadow on floor -->
  <ellipse cx="220" cy="140" rx="20" ry="5" fill="#000" opacity="0.2"/>

  <!-- Legs (standing, slightly apart — startled) -->
  <!-- Left leg -->
  <rect x="208" y="110" width="11" height="30" rx="5" fill="#2c3e50" transform="rotate(-5 213 125)"/>
  <!-- Right leg -->
  <rect x="222" y="110" width="11" height="30" rx="5" fill="#2c3e50" transform="rotate(5 227 125)"/>
  <!-- Shoes -->
  <ellipse cx="213" cy="141" rx="9" ry="4" fill="#1a1a1a"/>
  <ellipse cx="230" cy="141" rx="9" ry="4" fill="#1a1a1a"/>

  <!-- Body (upright, tense) -->
  <rect x="207" y="78" width="30" height="35" rx="8" fill="#4a90d9"/>

  <!-- Left arm — raised, elbow bent, hand near ear -->
  <line x1="208" y1="88" x2="192" y2="78" stroke="#F4A261" stroke-width="9" stroke-linecap="round"/>
  <line x1="192" y1="78" x2="200" y2="62" stroke="#F4A261" stroke-width="9" stroke-linecap="round"/>
  <!-- Hand cupped near ear -->
  <circle cx="201" cy="60" r="6" fill="#F4A261"/>

  <!-- Right arm out to side — startled -->
  <line x1="236" y1="88" x2="258" y2="100" stroke="#F4A261" stroke-width="9" stroke-linecap="round"/>
  <circle cx="261" cy="101" r="6" fill="#F4A261"/>

  <!-- Neck -->
  <rect x="216" y="68" width="10" height="12" rx="4" fill="#F4A261"/>

  <!-- Head -->
  <circle cx="221" cy="57" r="20" fill="#F4A261"/>

  <!-- Hair -->
  <ellipse cx="221" cy="40" rx="20" ry="10" fill="#3D2B1F"/>
  <ellipse cx="205" cy="49" rx="7" ry="11" fill="#3D2B1F"/>
  <ellipse cx="237" cy="49" rx="7" ry="11" fill="#3D2B1F"/>
  <ellipse cx="221" cy="38" rx="14" ry="7" fill="#3D2B1F"/>
  <!-- Hair tuft sticking up (startled) -->
  <ellipse cx="228" cy="36" rx="5" ry="7" fill="#3D2B1F" transform="rotate(20 228 36)"/>

  <!-- Face — wide-eyed, alert -->
  <!-- Eyes wide open -->
  <ellipse cx="213" cy="58" rx="5" ry="5.5" fill="#fff"/>
  <ellipse cx="229" cy="58" rx="5" ry="5.5" fill="#fff"/>
  <circle cx="214" cy="59" r="3" fill="#3D2B1F"/>
  <circle cx="230" cy="59" r="3" fill="#3D2B1F"/>
  <!-- Pupils shifted right (looking toward sound) -->
  <circle cx="215" cy="59" r="1.2" fill="#fff"/>
  <circle cx="231" cy="59" r="1.2" fill="#fff"/>

  <!-- Eyebrows raised high -->
  <path d="M208 51 Q213 48 218 51" fill="none" stroke="#3D2B1F" stroke-width="2" stroke-linecap="round"/>
  <path d="M224 51 Q229 48 234 51" fill="none" stroke="#3D2B1F" stroke-width="2" stroke-linecap="round"/>

  <!-- Mouth open in surprise / O shape -->
  <ellipse cx="221" cy="67" rx="4" ry="5" fill="#c0735a"/>
  <ellipse cx="221" cy="67" rx="2.5" ry="3.5" fill="#8b4513"/>

  <!-- Shirt collar -->
  <path d="M214 78 L221 74 L228 78" fill="none" stroke="#3a80c9" stroke-width="2"/>

  <!-- Sound waves coming from left (where the noise is) -->
  <path d="M120 80 Q110 75 120 70" fill="none" stroke="#ffd580" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M110 85 Q94 75 110 65" fill="none" stroke="#ffd580" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  <path d="M100 90 Q78 75 100 60" fill="none" stroke="#ffd580" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Small "!" above head -->
  <rect x="245" y="30" width="6" height="16" rx="3" fill="#f39c12"/>
  <circle cx="248" cy="52" r="3" fill="#f39c12"/>
</svg>
