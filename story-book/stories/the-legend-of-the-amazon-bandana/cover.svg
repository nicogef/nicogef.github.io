  <rect x="72" y="70" width="256" height="298" rx="5" fill="rgba(0,0,0,0.18)" transform="translate(4,5)"/>
  <!-- Map body -->
  <rect x="72" y="70" width="256" height="298" rx="5" fill="url(#parchment)" stroke="#7a5010" stroke-width="2.5"/>
  <!-- Inner dashed border -->
  <rect x="79" y="77" width="242" height="284" rx="3" fill="none" stroke="#9a7030"
        stroke-width="1.2" stroke-dasharray="6,4"/>

  <!-- Map title centered -->
  <text x="200" y="96" font-family="'Comic Sans MS',cursive" font-size="14" fill="#4a2600"
        text-anchor="middle" font-weight="bold">— THE AMAZON —</text>

  <!-- ══ RIVER (winding down left side of map, avoids globe) ══ -->
  <!-- River body -->
  <path d="M 100,77 Q 92,110 100,148 Q 108,182 100,218 Q 93,252 108,290 Q 120,325 100,362"
        fill="none" stroke="#4488cc" stroke-width="7" opacity="0.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- River highlight -->
  <path d="M 100,77 Q 92,110 100,148 Q 108,182 100,218 Q 93,252 108,290 Q 120,325 100,362"
        fill="none" stroke="#88ccff" stroke-width="2.5" opacity="0.7" stroke-linecap="round"/>
  <!-- River label -->
  <text x="72" y="222" font-family="'Comic Sans MS',cursive" font-size="7" fill="#336699"
        transform="rotate(-80,72,222)" text-anchor="middle" opacity="0.8">Rio Amazon</text>

  <!-- ══ AMAZON FOREST inside map — upper-left ══ -->
  <g>
    <rect x="84"  y="158" width="4" height="16" fill="#4a3008"/>
    <rect x="98"  y="162" width="4" height="14" fill="#4a3008"/>
    <rect x="112" y="158" width="4" height="17" fill="#4a3008"/>
    <rect x="126" y="164" width="3" height="12" fill="#4a3008"/>
    <polygon points="86,158  76,178  96,178"  fill="#145014" opacity="0.8"/>
    <polygon points="86,150  74,170  98,170"  fill="#1a6a1e"/>
    <polygon points="86,142  75,160  97,160"  fill="#228828"/>
    <polygon points="86,134  76,152  96,152"  fill="#2ca030"/>
    <polygon points="100,162  90,182 110,182" fill="#145014" opacity="0.8"/>
    <polygon points="100,153  88,174 112,174" fill="#1a6a1e"/>
    <polygon points="100,144  89,164 111,164" fill="#228828"/>
    <polygon points="100,136  90,154 110,154" fill="#2ca030"/>
    <polygon points="114,158 104,178 124,178" fill="#145014" opacity="0.8"/>
    <polygon points="114,149 103,170 125,170" fill="#1a6a1e"/>
    <polygon points="114,140 104,160 124,160" fill="#228828"/>
    <polygon points="114,133 105,150 123,150" fill="#2ca030"/>
    <polygon points="128,164 118,182 138,182" fill="#1a6a1e"/>
    <polygon points="128,156 118,174 138,174" fill="#228828"/>
    <rect x="76" y="176" width="68" height="6" fill="#1a6a1e" opacity="0.6" rx="2"/>
  </g>

  <!-- ══ AMAZON FOREST inside map — upper-right ══ -->
  <g>
    <rect x="274" y="155" width="4" height="17" fill="#4a3008"/>
    <rect x="288" y="160" width="4" height="14" fill="#4a3008"/>
    <rect x="302" y="156" width="4" height="16" fill="#4a3008"/>
    <polygon points="276,155 264,176 288,176" fill="#145014" opacity="0.8"/>
    <polygon points="276,146 263,168 289,168" fill="#1a6a1e"/>
    <polygon points="276,138 264,158 288,158" fill="#228828"/>
    <polygon points="276,130 265,148 287,148" fill="#2ca030"/>
    <polygon points="290,160 278,180 302,180" fill="#145014" opacity="0.8"/>
    <polygon points="290,151 277,172 303,172" fill="#1a6a1e"/>
    <polygon points="290,142 278,162 302,162" fill="#228828"/>
    <polygon points="304,156 292,176 316,176" fill="#1a6a1e"/>
    <polygon points="304,147 293,168 315,168" fill="#228828"/>
    <rect x="263" y="174" width="60" height="6" fill="#1a6a1e" opacity="0.6" rx="2"/>
  </g>

  <!-- Dotted trail path on map -->
  <path d="M 140,175 Q 165,200 185,230 Q 195,250 200,275"
        fill="none" stroke="#8a5020" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.7"/>
  <!-- X marks the spot (near globe center top, above cyclops) -->
  <line x1="196" y1="193" x2="208" y2="205" stroke="#cc2200" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="208" y1="193" x2="196" y2="205" stroke="#cc2200" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Small compass rose bottom-right of map -->
  <g transform="translate(305, 338)">
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#6a4010" stroke-width="1.5"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#6a4010" stroke-width="1.5"/>
    <polygon points="0,-12 -4,-4 4,-4" fill="#cc2200"/>
    <text x="0" y="-14" font-family="sans-serif" font-size="7" fill="#4a2800" text-anchor="middle" font-weight="bold">N</text>
  </g>

  <!-- ══ CHEERY SMALL BILLBOARDS — outside the map rectangle ══ -->

  <!-- "DANGER" top left -->
  <g transform="rotate(-5,50,75)">
    <rect x="24" y="60" width="52" height="22" rx="3" fill="#ff3333" stroke="#cc0000" stroke-width="1.2"/>
    <text x="50" y="75" font-family="'Arial Black',sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="900">DANGER</text>
    <line x1="50" y1="82" x2="50" y2="108" stroke="#6b4a1a" stroke-width="2.5"/>
    <rect x="45" y="107" width="10" height="4" fill="#8a6a2a" rx="1"/>
  </g>

  <!-- "INSIGHT" left -->
  <g transform="rotate(-7,46,140)">
    <rect x="20" y="128" width="52" height="22" rx="3" fill="#22ccff" stroke="#0099cc" stroke-width="1.2"/>
    <text x="46" y="143" font-family="'Arial Black',sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="900">INSIGHT</text>
    <line x1="46" y1="150" x2="46" y2="175" stroke="#6b4a1a" stroke-width="2.5"/>
    <rect x="41" y="174" width="10" height="4" fill="#8a6a2a" rx="1"/>
  </g>

  <!-- "SEARCH!" left -->
  <g transform="rotate(5,46,208)">
    <rect x="20" y="196" width="52" height="22" rx="3" fill="#ff9900" stroke="#cc7700" stroke-width="1.2"/>
