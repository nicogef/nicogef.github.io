<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180">
  <defs>
    <linearGradient id="stone-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#2e2420"/>
    </linearGradient>
    <radialGradient id="torch-glow-l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffa01e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffa01e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="torch-glow-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffa01e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffa01e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background stone wall -->
  <rect width="400" height="180" fill="url(#stone-bg)"/>

  <!-- Stone blocks pattern -->
  <g fill="none" stroke="#2a2420" stroke-width="1" opacity="0.6">
    <!-- Row 1 -->
    <rect x="0" y="0" width="60" height="30"/><rect x="60" y="0" width="80" height="30"/>
    <rect x="140" y="0" width="70" height="30"/><rect x="210" y="0" width="90" height="30"/>
    <rect x="300" y="0" width="60" height="30"/><rect x="360" y="0" width="40" height="30"/>
    <!-- Row 2 -->
    <rect x="0" y="30" width="40" height="30"/><rect x="40" y="30" width="70" height="30"/>
    <rect x="110" y="30" width="60" height="30"/><rect x="170" y="30" width="80" height="30"/>
    <rect x="250" y="30" width="70" height="30"/><rect x="320" y="30" width="80" height="30"/>
    <!-- Row 3 -->
    <rect x="0" y="60" width="65" height="30"/><rect x="65" y="60" width="75" height="30"/>
    <rect x="140" y="60" width="60" height="30"/><rect x="200" y="60" width="85" height="30"/>
    <rect x="285" y="60" width="55" height="30"/><rect x="340" y="60" width="60" height="30"/>
    <!-- Row 4 -->
    <rect x="0" y="90" width="50" height="30"/><rect x="50" y="90" width="80" height="30"/>
    <rect x="130" y="90" width="65" height="30"/><rect x="195" y="90" width="70" height="30"/>
    <rect x="265" y="90" width="75" height="30"/><rect x="340" y="90" width="60" height="30"/>
    <!-- Row 5 -->
    <rect x="0" y="120" width="70" height="60"/><rect x="70" y="120" width="60" height="60"/>
    <rect x="260" y="120" width="70" height="60"/><rect x="330" y="120" width="70" height="60"/>
  </g>

  <!-- Stone arch -->
  <path d="M 100 180 L 100 80 Q 200 20 300 80 L 300 180 Z" fill="#1a1510"/>
  <!-- Arch keystone highlight -->
  <path d="M 185 30 L 200 22 L 215 30 L 210 42 L 190 42 Z" fill="#2a2218"/>

  <!-- Dark tunnel inside arch -->
  <path d="M 115 180 L 115 90 Q 200 40 285 90 L 285 180 Z" fill="#050505"/>

  <!-- Iron gate bars -->
  <g stroke="#3a3028" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="140" y1="180" x2="140" y2="75"/>
    <line x1="160" y1="180" x2="160" y2="65"/>
    <line x1="180" y1="180" x2="180" y2="60"/>
    <line x1="200" y1="180" x2="200" y2="58"/>
    <line x1="220" y1="180" x2="220" y2="60"/>
    <line x1="240" y1="180" x2="240" y2="65"/>
    <line x1="260" y1="180" x2="260" y2="75"/>
  </g>
  <!-- Horizontal bar -->
  <rect x="130" y="120" width="140" height="8" fill="#3a3028" rx="2"/>

  <!-- Torch left glow -->
  <ellipse cx="90" cy="85" rx="35" ry="35" fill="url(#torch-glow-l)"/>
  <!-- Torch left bracket -->
  <rect x="82" y="90" width="10" height="20" fill="#5a4830" rx="2"/>
  <rect x="79" y="88" width="16" height="6" fill="#4a3820" rx="1"/>
  <!-- Torch left flame -->
  <ellipse cx="87" cy="83" rx="8" ry="12" fill="#ff8c00" opacity="0.9"/>
  <ellipse cx="87" cy="80" rx="5" ry="8" fill="#ffd700" opacity="0.8"/>
  <ellipse cx="87" cy="77" rx="3" ry="5" fill="#fff4c0" opacity="0.7"/>

  <!-- Torch right glow -->
  <ellipse cx="310" cy="85" rx="35" ry="35" fill="url(#torch-glow-r)"/>
  <!-- Torch right bracket -->
  <rect x="308" y="90" width="10" height="20" fill="#5a4830" rx="2"/>
  <rect x="305" y="88" width="16" height="6" fill="#4a3820" rx="1"/>
  <!-- Torch right flame -->
  <ellipse cx="313" cy="83" rx="8" ry="12" fill="#ff8c00" opacity="0.9"/>
  <ellipse cx="313" cy="80" rx="5" ry="8" fill="#ffd700" opacity="0.8"/>
  <ellipse cx="313" cy="77" rx="3" ry="5" fill="#fff4c0" opacity="0.7"/>

  <!-- Hooded figure in the archway -->
  <g fill="#0d0d0d" transform="translate(185,90)">
    <!-- Robe -->
    <path d="M 0 0 Q -18 30 -15 80 L 15 80 Q 18 30 0 0 Z"/>
    <!-- Hood -->
    <ellipse cx="0" cy="-5" rx="14" ry="16"/>
    <path d="M -14 -5 Q -20 5 -18 15 L -8 10 Q -10 0 0 -2 Q 10 0 8 10 L 18 15 Q 20 5 14 -5 Z" fill="#0a0a0a"/>
    <!-- Face shadow -->
    <ellipse cx="0" cy="2" rx="8" ry="9" fill="#080808"/>
    <!-- Eyes glint -->
    <circle cx="-3" cy="1" r="1.5" fill="#c8a060" opacity="0.7"/>
    <circle cx="3" cy="1" r="1.5" fill="#c8a060" opacity="0.7"/>
    <!-- Raised hand -->
    <path d="M 15 10 Q 28 5 30 -5 L 25 -3 Q 24 3 15 8 Z" fill="#0d0d0d"/>
  </g>

  <!-- Vignette -->
  <rect x="0" y="0" width="100" height="180" fill="#000" fill-opacity="0.35"/>
  <rect x="300" y="0" width="100" height="180" fill="#000" fill-opacity="0.35"/>
  <rect x="0" y="0" width="400" height="40" fill="#000" fill-opacity="0.2"/>
</svg>
